name: Beitrag erzeugen & freigeben

on:
  schedule:
    # Dienstag & Donnerstag, 07:00 UTC (= 08:00/09:00 DE). ~2 Beiträge/Woche.
    - cron: '0 7 * * 2,4'
  workflow_dispatch: {}   # manueller Start per Knopf möglich

permissions:
  contents: write

concurrency:
  group: generate
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    outputs:
      slug: ${{ steps.gen.outputs.slug }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Markenfonts installieren (Montserrat + Inter)
        run: |
          mkdir -p ~/.fonts
          curl -sL "https://github.com/google/fonts/raw/main/ofl/montserrat/Montserrat%5Bwght%5D.ttf" -o ~/.fonts/Montserrat.ttf
          curl -sL "https://github.com/google/fonts/raw/main/ofl/inter/Inter%5Bwght%5D.ttf" -o ~/.fonts/Inter.ttf || true
          fc-cache -f

      - run: npm ci

      - name: Draft erzeugen
        id: gen
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: npm run --silent generate

      - name: Draft committen & pushen
        if: steps.gen.outputs.slug != ''
        run: |
          git config user.name "mainilkanjo-social-bot"
          git config user.email "bot@users.noreply.github.com"
          git add pending state
          git commit -m "draft: ${{ steps.gen.outputs.slug }}" || echo "nichts zu committen"
          git push

      - name: Vorschau in die Zusammenfassung schreiben
        if: steps.gen.outputs.slug != ''
        run: |
          SLUG="${{ steps.gen.outputs.slug }}"
          HEAD=$(jq -r .headline "pending/$SLUG.json")
          CAP=$(jq -r .caption "pending/$SLUG.json")
          {
            echo "## 📣 Neuer Beitrag – wartet auf deine Freigabe"
            echo ""
            echo "**$HEAD**"
            echo ""
            echo "![Motiv](https://raw.githubusercontent.com/${{ github.repository }}/main/pending/$SLUG.jpg)"
            echo ""
            echo "$CAP"
            echo ""
            echo "---"
            echo "**Freigeben:** oben auf dieser Seite **\"Review deployments\" → \"freigabe\" ankreuzen → \"Approve and deploy\"**."
            echo "Der Beitrag geht dann automatisch auf Instagram + Facebook."
            echo ""
            echo "**Verwerfen:** stattdessen **\"Reject\"** klicken – dann passiert nichts."
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    needs: generate
    if: needs.generate.outputs.slug != ''
    runs-on: ubuntu-latest
    environment: freigabe   # erzwingt manuelle Freigabe (Pflicht-Reviewer in den Repo-Settings)
    concurrency:
      group: publish-${{ needs.generate.outputs.slug }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main   # holt den frisch gepushten Draft-Commit

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - run: npm ci

      - name: Auf Instagram + Facebook veröffentlichen
        env:
          SLUG: ${{ needs.generate.outputs.slug }}
          ACTION: publish
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          IMAGE_BASE_URL: ${{ secrets.IMAGE_BASE_URL }}
        run: npm run --silent publish

      - name: Ergebnis committen & pushen
        run: |
          git config user.name "mainilkanjo-social-bot"
          git config user.email "bot@users.noreply.github.com"
          git pull --rebase --autostash || true
          git add pending published || true
          git commit -m "published: ${{ needs.generate.outputs.slug }}" || echo "nichts zu committen"
          git push
